<!doctype html>
<html lang="en" data-theme="ink" data-accent="violet">
<head>
  <meta charset="utf-8">
  <title>PDF Do</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PDF Do — a private, offline PDF studio: read, annotate, edit text with any font, merge, split, compare and convert.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="lib/pdf.min.js"></script>
  <script src="lib/pdf-lib.min.js"></script>
  <script src="lib/fontkit.umd.min.js"></script>
  <script src="lib/tess/tesseract.min.js"></script>
  <script src="assets/fonts/fonts.js"></script>
</head>
<body data-mode="home" data-view="home">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <div id="app">
    <header id="titlebar">
      <div class="brand" title="PDF Do">
        <img class="logo" src="assets/logo.svg" alt="">
        <span class="wordmark">PDF<b>Do</b></span>
      </div>
      <div id="tabs" role="tablist"></div>
      <button id="btn-cmdk" class="cmdk" type="button">
        <i data-ic="search" data-s="16"></i><span>Search tools &amp; commands</span><kbd>Ctrl K</kbd>
      </button>
      <div class="tb-right">
        <button id="btn-left" class="icon-btn" type="button" data-tip="Toggle sidebar"><i data-ic="panel" data-s="18"></i></button>
        <button id="btn-insp" class="icon-btn" type="button" data-tip="Toggle properties"><i data-ic="panelr" data-s="18"></i></button>
        <span class="tb-sep"></span>
        <button id="btn-undo" class="icon-btn" type="button" data-tip="Undo" data-key="Ctrl+Z"><i data-ic="undo" data-s="18"></i></button>
        <button id="btn-redo" class="icon-btn" type="button" data-tip="Redo" data-key="Ctrl+Y"><i data-ic="redo" data-s="18"></i></button>
        <button id="btn-save" class="btn primary small" type="button" data-tip="Save" data-key="Ctrl+S"><i data-ic="save" data-s="16"></i><span>Save</span></button>
        <button id="btn-theme" class="icon-btn" type="button" data-tip="Switch light / dark"><i data-ic="moonsun" data-s="18"></i></button>
        <button id="btn-menu" class="icon-btn" type="button" data-tip="Menu"><i data-ic="menu" data-s="18"></i></button>
      </div>
    </header>

    <nav id="rail" aria-label="Modes"></nav>

    <main id="work">
      <aside id="leftpanel"></aside>

      <section id="stage">
        <div id="island" aria-label="Tools"></div>
        <div id="views">
          <section data-view="home" id="home"></section>

          <section data-view="viewer" id="viewer">
            <div id="scroll"><div id="pages" class="pages continuous"></div></div>
            <div id="dock" aria-label="View controls"></div>
          </section>

          <section data-view="grid" id="gridview">
            <div id="pagesbar" class="islandbar"></div>
            <div id="gridscroll"><div id="pagegrid"></div></div>
          </section>

          <section data-view="merge" id="mergeview">
            <div class="view-head"><h1>Merge</h1><p>Combine PDFs and images into one document. Drag cards to reorder, or drop files anywhere.</p></div>
            <div class="merge-wrap">
              <div class="merge-main">
                <div class="merge-toolbar">
                  <button id="merge-add" class="btn primary" type="button"><i data-ic="plus" data-s="16"></i><span>Add files…</span></button>
                  <button id="merge-open" class="btn" type="button"><i data-ic="layers" data-s="16"></i><span>Add open documents</span></button>
                  <span class="spacer"></span>
                  <div class="msort"><span>Sort</span>
                    <button class="btn small" data-msort="az" type="button">A→Z</button><button class="btn small" data-msort="za" type="button">Z→A</button>
                    <button class="btn small" data-msort="new" type="button">Newest</button><button class="btn small" data-msort="old" type="button">Oldest</button>
                    <button class="btn small" data-msort="big" type="button">Largest</button><button class="btn small" data-msort="small" type="button">Smallest</button>
                    <button class="btn small" data-msort="rev" type="button">Reverse</button>
                  </div>
                  <button id="merge-clear" class="btn ghost small" type="button">Clear</button>
                </div>
                <div id="mergelist"></div>
              </div>
              <aside class="merge-side">
                <h3>Result</h3>
                <div id="merge-summary" class="muted">Nothing added yet</div>
                <label class="field"><span>File name</span><input id="merge-name" class="input" type="text" value="Merged document"></label>
                <label class="checkrow"><input id="merge-bm" type="checkbox" checked><span class="cbox"></span><span>Add a bookmark for each file</span></label>
                <button id="merge-go" class="btn primary big block" type="button" disabled><i data-ic="merge" data-s="18"></i><span>Merge into a new tab</span></button>
                <p class="muted small">Tip: use the “Pages” box on a card to take only some pages — e.g. <code>1-3, 7</code>, <code>odd</code>, <code>last</code>.</p>
              </aside>
            </div>
          </section>

          <section data-view="compare" id="compareview"></section>
          <section data-view="cards" id="cardsview"></section>
        </div>
      </section>

      <aside id="inspector">
        <div class="insp-head"><i data-ic="sliders" data-s="16"></i><b>Properties</b></div>
        <div id="inspector-body"></div>
      </aside>
    </main>
  </div>

  <div id="dropveil"><div><i data-ic="download" data-s="44"></i><b>Drop to open</b><small>PDFs, images and font files</small></div></div>
  <div id="palette"></div>
  <div id="modal-root"></div>
  <div id="busy"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="printroot"></div>

  <script src="js/core.js"></script>
  <script src="js/fonts.js"></script>
  <script src="js/doc.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/annot.js"></script>
  <script src="js/inspector.js"></script>
  <script src="js/burn.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/service.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/convert.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
